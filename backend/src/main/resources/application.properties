# Database Configuration (H2 Memory by default with PostgreSQL compatibility, or PostgreSQL via env)
spring.datasource.url=${DB_URL:jdbc:h2:mem:autoflexdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://autoflex-test.vercel.app,http://localhost:3000}