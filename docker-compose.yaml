services:
  database:
    image: postgres:16-alpine
    container_name: autoflex-postgres
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Erro: Variavel POSTGRES_PASSWORD nao definida. Configure o arquivo .env a partir do .env.example}"
      POSTGRES_DB: "${POSTGRES_DB:-autoflex_db}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autoflex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-autoflex_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoflex-backend
    restart: always
    environment:
      DB_URL: "jdbc:postgresql://database:5432/${POSTGRES_DB:-autoflex_db}"
      DB_USER: "${POSTGRES_USER:-postgres}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Erro: Variavel POSTGRES_PASSWORD nao definida. Configure o arquivo .env a partir do .env.example}"
      DB_DRIVER: "org.postgresql.Driver"
      JWT_SECRET: "${JWT_SECRET:-autoflex-pcp-production-planning-secret-key-256-bits-minimum-length-key}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost:3000}"
    ports:
      - "8080:8080"
    networks:
      - autoflex-network
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoflex-frontend
    restart: always
    ports:
      - "5173:80"
    networks:
      - autoflex-network
    depends_on:
      - backend

networks:
  autoflex-network:
    driver: bridge

volumes:
  postgres_data:
