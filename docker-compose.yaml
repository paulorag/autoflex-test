version: "3.8"

services:
  database:
    image: postgres:16-alpine
    container_name: autoflex-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=autoflex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoflex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoflex-backend
    restart: always
    environment:
      - DB_URL=jdbc:postgresql://database:5432/autoflex_db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_DRIVER=org.postgresql.Driver
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoflex-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
